[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasa-mcmcis"
version = "0.1.0"
description = "MCMC importance sampling and SAMC for rare permutation-test p-values"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Noam Chowers", email = "noamchowers@mail.tau.ac.il" },
]
keywords = [
  "permutation test",
  "importance sampling",
  "Markov chain Monte Carlo",
  "rare events",
  "p-value",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/NoamChowers/smoothly_tilted_mcmcis"
Reproducibility = "https://github.com/NoamChowers/smoothly_tilted_mcmcis"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
repro = [
  "matplotlib>=3.9",
  "pandas>=2.2",
  "scipy>=1.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jasa_mcmcis*"]

[tool.setuptools.package-data]
jasa_mcmcis = [
  "data/scenarios/catalog.json",
  "data/scenarios/*/metadata.json",
  "data/scenarios/*/X.npy",
  "data/scenarios/*/y_obs.npy",
]
